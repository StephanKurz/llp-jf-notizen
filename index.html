<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JF-Notizen</title>
<style>
  :root {
    --red: #bd0010;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
    --ok: #1e7e34;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  #app { max-width: 1080px; margin: 0 auto; padding: 22px 20px 60px; }

  #navbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  #navbar button {
    padding: 7px 14px; border: none; border-radius: 6px;
    background: var(--red); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  #navbar button:disabled { opacity: 0.5; cursor: default; }
  #posLabel { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

  #card {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px;
  }
  #eventTitle { font-size: 16px; font-weight: 600; margin: 0; }
  #eventMeta { font-size: 12.5px; color: var(--muted); margin-top: 3px; margin-bottom: 14px; }

  #content {
    font-size: 14.5px; line-height: 1.5; color: var(--text);
    outline: none; min-height: 160px;
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  #content p { margin: 0 0 10px; }
  #content ul, #content ol { margin: 0 0 10px; padding-left: 22px; }
  #content li { margin-bottom: 4px; }
  #content:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
  }
  #content:focus { outline: none; }

  #emptyState, #error, #hint {
    text-align: center; font-size: 13px; color: var(--muted); margin-top: 24px;
  }
  #error { color: var(--danger); }

  #actions {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px; margin-top: 14px;
  }
  #saveHint { font-size: 12px; color: var(--muted); }
  #saveBtn {
    padding: 8px 18px; border: none; border-radius: 6px;
    background: var(--red); color: #fff; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  #saveBtn:disabled { opacity: 0.5; cursor: default; }
  #saveBtn.saved { background: var(--ok); }

  #toast {
    margin-top: 10px; text-align: right; font-size: 12.5px;
    color: var(--ok); min-height: 16px;
  }
  #toast.error { color: var(--danger); }
</style>
</head>
<body>
<div id="app">
  <div id="navbar">
    <button type="button" id="prevBtn">‹ Früher</button>
    <span id="posLabel">–</span>
    <button type="button" id="nextBtn">Später ›</button>
  </div>

  <div id="card">
    <h2 id="eventTitle">Lädt …</h2>
    <div id="eventMeta">&nbsp;</div>
    <div id="content" contenteditable="false" data-placeholder="Keine Beschreibung vorhanden. Tippen, um einen Eintrag hinzuzufügen …"></div>
    <div id="emptyState" style="display:none;"></div>
    <div id="actions">
      <span id="saveHint"></span>
      <button type="button" id="saveBtn" disabled>Speichern</button>
    </div>
    <div id="toast"></div>
  </div>
</div>

<script>
(function () {
  const FN_BASE = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1";
  const LIST_URL = FN_BASE + "/jf-list";
  const UPDATE_URL = FN_BASE + "/jf-update";
  const NEW_ENTRY_COLOR = "#2f5fa8";

  const contentEl = document.getElementById("content");
  const emptyStateEl = document.getElementById("emptyState");
  const titleEl = document.getElementById("eventTitle");
  const metaEl = document.getElementById("eventMeta");
  const posLabel = document.getElementById("posLabel");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const saveBtn = document.getElementById("saveBtn");
  const saveHint = document.getElementById("saveHint");
  const toastEl = document.getElementById("toast");

  let events = [];
  let currentIndex = -1;
  let originalHtml = "";
  let dirty = false;

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toastEl.textContent = ""; }, 3500);
  }

  function fmtDate(iso) {
    if (!iso) return "Kein Datum";
    const d = new Date(iso);
    return d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }) +
      " · " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }

  function setDirty(v) {
    dirty = v;
    saveBtn.disabled = !v;
    saveBtn.classList.remove("saved");
    saveBtn.textContent = "Speichern";
    saveHint.textContent = v ? "Ungespeicherte Änderungen" : "";
  }

  function loadIndex(i) {
    if (i < 0 || i >= events.length) return;
    currentIndex = i;
    const ev = events[i];
    titleEl.textContent = ev.name || "JF-Termin";
    metaEl.textContent = fmtDate(ev.start);
    posLabel.textContent = (i + 1) + " von " + events.length;
    originalHtml = ev.description || "";
    contentEl.innerHTML = originalHtml;
    contentEl.contentEditable = "true";
    prevBtn.disabled = i <= 0;
    nextBtn.disabled = i >= events.length - 1;
    setDirty(false);
  }

  function confirmNavAway() {
    if (!dirty) return true;
    return confirm("Ungespeicherte Änderungen verwerfen und zu einem anderen JF-Termin wechseln?");
  }

  prevBtn.addEventListener("click", () => {
    if (currentIndex <= 0) return;
    if (!confirmNavAway()) return;
    loadIndex(currentIndex - 1);
  });
  nextBtn.addEventListener("click", () => {
    if (currentIndex >= events.length - 1) return;
    if (!confirmNavAway()) return;
    loadIndex(currentIndex + 1);
  });

  // Jede Neueingabe soll blau erscheinen, damit sie sich vom vorhandenen
  // schwarzen Text abhebt. execCommand("foreColor") auf eine eingeklappte
  // Selektion ist über Browser/Eingabemethoden hinweg unzuverlässig, daher
  // wird neu getippter Text direkt selbst in ein blaues <span> eingefügt statt
  // sich auf den Formatierungs-Zustand des Editors zu verlassen. Der Cursor
  // bleibt dabei im Text-Node des Spans, damit aufeinanderfolgende Zeichen im
  // selben Span landen (kein Span pro Buchstabe).
  function insertBlueText(text) {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();

    const atEndOfBlueRun =
      range.startContainer.nodeType === Node.TEXT_NODE &&
      range.startContainer.parentElement &&
      range.startContainer.parentElement.dataset.blueEntry === "1" &&
      range.startOffset === range.startContainer.textContent.length;

    if (atEndOfBlueRun) {
      const textNode = range.startContainer;
      textNode.textContent += text;
      range.setStart(textNode, textNode.textContent.length);
      range.setEnd(textNode, textNode.textContent.length);
    } else {
      const span = document.createElement("span");
      span.dataset.blueEntry = "1";
      span.style.color = NEW_ENTRY_COLOR;
      span.appendChild(document.createTextNode(text));
      range.insertNode(span);
      const textNode = span.firstChild;
      range.setStart(textNode, textNode.textContent.length);
      range.setEnd(textNode, textNode.textContent.length);
    }
    sel.removeAllRanges();
    sel.addRange(range);
  }

  contentEl.addEventListener("beforeinput", (e) => {
    if (e.inputType === "insertText" && e.data) {
      e.preventDefault();
      insertBlueText(e.data);
      setDirty(contentEl.innerHTML !== originalHtml);
    }
  });

  contentEl.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    document.execCommand("insertHTML", false, '<span style="color:' + NEW_ENTRY_COLOR + ';">' + escaped + "</span>");
  });

  contentEl.addEventListener("input", () => {
    setDirty(contentEl.innerHTML !== originalHtml);
  });

  saveBtn.addEventListener("click", async () => {
    if (!dirty || currentIndex < 0) return;
    const ev = events[currentIndex];
    const newHtml = contentEl.innerHTML;
    saveBtn.disabled = true;
    saveBtn.textContent = "Speichert …";
    try {
      const resp = await fetch(UPDATE_URL, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: ev.id, description: newHtml }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || ("Fehler " + resp.status));
      ev.description = data.description;
      originalHtml = contentEl.innerHTML;
      dirty = false;
      saveBtn.classList.add("saved");
      saveBtn.textContent = "Gespeichert ✓";
      saveHint.textContent = "";
      showToast("Beschreibung gespeichert.");
      setTimeout(() => {
        if (!dirty) { saveBtn.textContent = "Speichern"; saveBtn.classList.remove("saved"); saveBtn.disabled = true; }
      }, 1800);
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Speichern";
      showToast("Speichern fehlgeschlagen: " + err.message, true);
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  async function init() {
    try {
      const resp = await fetch(LIST_URL);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || ("Fehler " + resp.status));
      events = data.events || [];
      if (events.length === 0) {
        titleEl.textContent = "Keine JF-Termine";
        metaEl.textContent = "";
        contentEl.style.display = "none";
        emptyStateEl.style.display = "block";
        emptyStateEl.textContent = "Es wurden keine Termine mit dem Namen \"JF...\" gefunden.";
        return;
      }
      const now = new Date().toISOString();
      let startIdx = events.length - 1;
      for (let i = events.length - 1; i >= 0; i--) {
        if (events[i].start && events[i].start <= now) { startIdx = i; break; }
      }
      loadIndex(startIdx);
    } catch (err) {
      titleEl.textContent = "Fehler beim Laden";
      metaEl.textContent = "";
      contentEl.style.display = "none";
      emptyStateEl.style.display = "block";
      emptyStateEl.textContent = "JF-Termine konnten nicht geladen werden: " + err.message;
    }
  }

  init();
})();
</script>
</body>
</html>
